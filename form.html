<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" novalidate>
        <label for="name">Name :</label>
        <input type="text" name="UserName" id="Name"><br><br>

        <label for="Email">Email :</label>
        <input type="email" name="email" id="Email"><br><br>

        <label for="Con">Contact :</label>
        <input type="tel" name="Contact" id="Con" maxlength="10"><br><br>

        <label for="Date">Date of Birth :</label>
        <input type="date" name="date" id="Date"><br><br>

        <label for="Age">Age :</label>
        <input type="number" name="Age" id="Age"><br><br>

        <label for="Genz">Gender :</label>
        <input type="radio" name="Gender" id="Genz" value="Female">Women
        <input type="radio" name="Gender" id="Genz" value="Male">Men
        <br><br>
         
        <label for="addr">Address :</label>
        <textarea name="Address" id="addr" rows="5" cols="40"></textarea>
        <br><br>

        <label for="">Skills :</label>
       <ol>
        <input type="checkbox" name="Skills" value="java">JAVA <br>
        <input type="checkbox" name="Skills" value="python">PYTHON <br>
        <input type="checkbox" name="Skills" value="sql">SQL <br>
       </ol>
        <br><br>

        <label for=""> Resume :</label>
        <input type="file"><br><br>
        
        <input type="submit"><br><br>

        <input type="reset"><br><br>

        <input type="color" ><br><br>

        <input type="search" placeholder="search"><br><br>

        <progress></progress><br><br>

        <input type="image" src="./IMAGES/PASTA.jpeg" height="100px" width="100px"><br><br>
        
        <label for="">Education : </label>
        <select name="" id="">
            <optgroup label="Bachelors">
                <option value="">BCS</option>
                <option value="">BCA</option>
                <option value="">B.E</option>
            </optgroup>
    
            <optgroup label="Masters">
                <option value="">MCS</option>
                <option value="">MCA</option>
                <option value="">M.E</option>
            </optgroup>
        </select> <br><br>
       
        <input type="text" placeholder="Capital Letters Only"><br><br>

        <input type="text" required placeholder="required"><br><br>

        <input type="text" readonly placeholder="Confidential Info"><br><br>

        <input type="text" autofocus placeholder="focus"><br><br>

        <input type="text" size="100" placeholder="size"><br><br>

        <input type="text" maxlength="10" minlength="10" placeholder="Contact"><br><br>
        
        <input type="date" max="2024-09-20" min="2024-09-10"><br><br>

        <ol>
            <input type="checkbox" >JAVA <br>
            <input type="checkbox" >PYTHON <br>
            <input type="checkbox" checked>SQL <br>
            <input type="checkbox" >WEB-TECH<br>
        </ol>
            <br><br>
        
        <input type="password" placeholder="password" pattern="[A-Za-z0-9!@#$%]{8}">
        
        <audio src="./Dr. Dre - Still D.R.E. (Lyrics) ft. Snoop Dogg (720p).mp4" controls loop ></audio>
        <audio src="./The Weeknd - Starboy (Audio) ft. Daft Punk.mp4" controls autoplay ></audio>

        <video src="./Jeene Laga Hoon Lyrical - Ramaiya Vastavaiya_Girish Kumar, Shruti Haasan _Atif Aslam, Shreya Ghoshal.mp4" controls autoplay></video>
        
        
        
        
        
        <br><br>
        <button>Submit</button>

    </form>
</body>
</html>
